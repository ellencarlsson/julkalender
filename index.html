<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Haris Julkalender</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Dancing+Script:wght@600&family=Patrick+Hand&display=swap">
  <link rel="stylesheet" href="./style.css?v=9da1a533f6">
  <script>
    // Shows a reload message if the app fails to load or crashes before it is ready.
    window.addEventListener("error", () => {
      if (document.documentElement.dataset.appReady) return;
      document.getElementById("load-error")?.removeAttribute("hidden");
    }, true);
  </script>
  <script type="importmap">
  {
    "imports": {
      "./app.js": "./app.js?v=d33f1fb67a",
      "./block-pager.js": "./block-pager.js?v=93a97a2d06",
      "./crossword-view.js": "./crossword-view.js?v=2c258ce5c6",
      "./door-view.js": "./door-view.js?v=c70dfdc149",
      "./doors.js": "./doors.js?v=2b6119d4d8",
      "./final-message.js": "./final-message.js?v=227146e48e",
      "./firebase-config.js": "./firebase-config.js?v=9d2969ef94",
      "./hint-tracker.js": "./hint-tracker.js?v=3811ee7f5c",
      "./level-tracker.js": "./level-tracker.js?v=946e898f66",
      "./lib/crossword.js": "./lib/crossword.js?v=5f3683877a",
      "./lib/door-state.js": "./lib/door-state.js?v=91df6ae122",
      "./lib/hints.js": "./lib/hints.js?v=43e3f72143",
      "./lib/level.js": "./lib/level.js?v=f3da8b800a",
      "./lib/matching.js": "./lib/matching.js?v=8ad187ecee",
      "./lib/periodic.js": "./lib/periodic.js?v=d765f90375",
      "./lib/progress.js": "./lib/progress.js?v=2bc2af29b5",
      "./lib/quiz.js": "./lib/quiz.js?v=962c550567",
      "./lib/router.js": "./lib/router.js?v=d520c19738",
      "./lib/sudoku.js": "./lib/sudoku.js?v=e271b8ebc9",
      "./lib/test-door.js": "./lib/test-door.js?v=8e0480cff7",
      "./lib/test-reset.js": "./lib/test-reset.js?v=3010622ffe",
      "./lib/unlock-time.js": "./lib/unlock-time.js?v=7197c095d4",
      "./match-lines.js": "./match-lines.js?v=59d32aae73",
      "./matching-view.js": "./matching-view.js?v=9726a0d8eb",
      "./periodic-tiles.js": "./periodic-tiles.js?v=16fcd305c5",
      "./progress.js": "./progress.js?v=bbe6e79699",
      "./quiz-hint.js": "./quiz-hint.js?v=8408a05fe9",
      "./quiz-view.js": "./quiz-view.js?v=28973fcc7b",
      "./sidequest-view.js": "./sidequest-view.js?v=fd44619442",
      "./sidequests.js": "./sidequests.js?v=aeffc0c02d",
      "./sudoku-view.js": "./sudoku-view.js?v=b6d27661a5",
      "./task-ui.js": "./task-ui.js?v=6c8d6c079c",
      "./ui.js": "./ui.js?v=46ff9090f2"
    }
  }
  </script>
  <script type="module" src="./app.js?v=d33f1fb67a"></script>
</head>
<body>
  <main>
    <h1 class="site-title">
      <img src="./images/theme/title-oneline.webp" alt="Haris Julkalender" width="1400" height="362">
    </h1>

    <section id="signed-out" hidden>
      <button id="sign-in-button" type="button">Logga in med Google</button>
    </section>

    <div id="signed-in" hidden>
      <header class="game-header">
        <nav class="main-nav">
          <a href="#/backpack" data-nav="backpack" class="icon-button" aria-label="Ryggsäck" title="Ryggsäck"><span aria-hidden="true">🎒</span></a>
          <a href="#/sidequests" data-nav="sidequests" class="icon-button" aria-label="Side quests" title="Side quests"><span aria-hidden="true">📝</span></a>
          <a href="#/" data-nav="overview" class="icon-button" aria-label="Luckor" title="Luckor"><span aria-hidden="true">📅</span></a>
        </nav>

        <a href="#/sidequests" id="hint-circle" class="hint-circle" data-nav="sidequests" aria-label="0 chokladbollar. Visa sidouppdrag">
          <span id="hint-points" class="hint-number">0</span><img class="hint-bulb cb-icon" src="./images/theme/chokladboll.webp" alt="" aria-hidden="true">
        </a>

        <div id="level-ring" class="level-ring" role="progressbar" aria-label="Nivå 0, 0 av 100 XP mot nästa nivå" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <span id="level" class="level-number">0</span>
        </div>
      </header>

      <p id="level-up" class="level-up" role="status" hidden></p>

      <section id="view-overview" data-view="overview">
        <article id="final-message" class="final-message" hidden>
          <h2>Ett meddelande från Ellen</h2>
          <p id="final-message-text"></p>
        </article>
        <ol id="door-grid" class="door-grid"></ol>
      </section>

      <section id="view-door" data-view="door" hidden>
        <p class="door-done"><span class="check-icon" aria-hidden="true"></span> Lucka avklarad</p>
        <div class="door-header">
          <a id="prev-door" class="door-arrow" aria-label="Föregående lucka">&lt;</a>
          <h2 id="door-title">Lucka</h2>
          <a id="next-door" class="door-arrow" aria-label="Nästa lucka">&gt;</a>
        </div>
        <div id="task-area" class="task-area"></div>
      </section>

      <div id="door-tools" class="door-tools"></div>

      <section id="view-backpack" data-view="backpack" hidden>
        <h2>Ryggsäck</h2>
        <div class="panel">
          <h3>Ledtrådar</h3>
          <ul id="clue-list"></ul>
          <p id="clues-empty">Inga ledtrådar än.</p>
        </div>
      </section>

      <section id="view-sidequests" data-view="sidequests" hidden>
        <h2>Side quests</h2>
        <p class="sidequests-intro">Bocka av ett uppdrag när du har gjort det, så får du chokladbollar.</p>
        <div id="sidequest-list" class="task-area"></div>
      </section>

      <footer class="app-footer">
        <p>Inloggad som: <span id="user-name"></span></p>
        <button id="sign-out-button" type="button">Logga ut</button>
      </footer>
    </div>

    <p id="auth-error" role="alert" hidden></p>

    <div id="load-error" class="load-error" role="alert" hidden>
      <p>Något gick fel när sidan laddades.</p>
      <button type="button" onclick="location.reload()">Ladda om</button>
    </div>
  </main>
</body>
</html>
