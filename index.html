<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Julkalender</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main>
    <h1>Julkalender</h1>

    <section id="signed-out" hidden>
      <button id="sign-in-button" type="button">Logga in med Google</button>
    </section>

    <section id="signed-in" hidden>
      <p>Hej, <span id="user-name"></span>!</p>
      <button id="sign-out-button" type="button">Logga ut</button>

      <section id="admin" hidden>
        <h2>Admin</h2>
        <label for="content-files">Innehåll (JSON-filer för luckor och slutmeddelande)</label>
        <input id="content-files" type="file" accept=".json,application/json" multiple>
        <button id="upload-button" type="button">Ladda upp innehåll</button>
        <button id="reset-button" type="button">Nollställ min progress</button>
        <pre id="admin-status" role="status"></pre>
      </section>
    </section>

    <p id="auth-error" role="alert" hidden></p>
  </main>
</body>
</html>
