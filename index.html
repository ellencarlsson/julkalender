<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Julkalender</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main>
    <h1>Julkalender</h1>

    <section id="signed-out" hidden>
      <button id="sign-in-button" type="button">Logga in med Google</button>
    </section>

    <div id="signed-in" hidden>
      <header class="game-header">
        <nav class="main-nav">
          <a href="#/backpack" data-nav="backpack" class="icon-button" aria-label="Ryggsäck" title="Ryggsäck"><span aria-hidden="true">🎒</span></a>
          <a href="#/" data-nav="overview" class="icon-button" aria-label="Luckor" title="Luckor"><span aria-hidden="true">📅</span></a>
        </nav>

        <div id="level-ring" class="level-ring" role="progressbar" aria-label="Nivå 0, 0 av 100 XP mot nästa nivå" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <span id="level" class="level-number">0</span>
        </div>
      </header>

      <section id="view-overview" data-view="overview">
        <h2>Luckor</h2>
        <ol id="door-grid" class="door-grid"></ol>
      </section>

      <section id="view-door" data-view="door" hidden>
        <a href="#/" class="back-link">← Tillbaka till luckorna</a>
        <h2 id="door-title">Lucka</h2>
        <div id="task-area" class="panel">
          <p>Här kommer luckans uppgifter.</p>
        </div>
      </section>

      <section id="view-backpack" data-view="backpack" hidden>
        <h2>Ryggsäck</h2>
        <div class="panel">
          <h3>Ledtrådar</h3>
          <ul id="clue-list"></ul>
          <p id="clues-empty">Inga ledtrådar än.</p>
        </div>
        <div class="panel">
          <h3>Ledtrådspoäng</h3>
          <p>Du har <strong id="backpack-hint-points">0</strong> ledtrådspoäng.</p>
        </div>
      </section>

      <footer class="app-footer">
        <p>Inloggad som: <span id="user-name"></span></p>
        <button id="sign-out-button" class="small" type="button">Logga ut</button>
      </footer>
    </div>

    <p id="auth-error" role="alert" hidden></p>
  </main>
</body>
</html>
